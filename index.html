<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доставка — Тот гусь (тестовая копия)</title>
  <style>
    :root { --brand: #437678; --ink: #1d2b2c; --muted: #6b7b7c; --bg: #f4f1ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--brand); color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header b { font-size: 22px; letter-spacing: .5px; }
    header nav a { color: #fff; margin-left: 16px; text-decoration: none; opacity: .85; }
    .probe { background: #fff8d6; border-bottom: 1px solid #e8dca0; padding: 10px 16px; font-size: 14px; }
    .probe code { background: #fff; padding: 1px 4px; border-radius: 3px; }
    .probe form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .probe input { flex: 1 1 320px; padding: 6px 8px; font: inherit; }
    .probe button { padding: 6px 12px; font: inherit; cursor: pointer; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 16px; font-size: 32px; }
    /* как на totgus.ru: блок с iframe высотой 800px */
    .embed { height: 800px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .embed iframe { width: 100%; height: 100%; border: 0; }
    footer { background: var(--brand); color: #fff; padding: 24px 16px; margin-top: 32px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <b>ТОТ ГУСЬ</b>
    <nav><a href="#">Меню</a><a href="#">Доставка</a><a href="#">Контакты</a></nav>
  </header>

  <div class="probe">
    Тестовая копия <code>https://totgus.ru/dostavka</code> для проверки встраивания.
    Эта страница: <code id="origin"></code>. Во фрейме: <code id="src"></code>
    <form id="form">
      <input id="url" name="src" placeholder="https://dev-web.restomania.ru/kugel/345" autocomplete="off">
      <button>Открыть во фрейме</button>
    </form>
    <div id="status" style="margin-top:6px"></div>
  </div>

  <main>
    <h1>Доставка</h1>
    <div class="embed">
      <!-- Тот же тег, что на totgus.ru (src подставляется из ?src=) -->
      <iframe id="frame" frameborder="0" hspace="0" vspace="0" marginheight="0" marginwidth="0" seamless scrolling="auto"></iframe>
    </div>
  </main>

  <footer>© Тот гусь — тестовая страница, не настоящий сайт.</footer>

  <script>
    // Локально — web из `nuxt dev`, на GitHub Pages — ресторан на DEV-сервере.
    var IS_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var DEFAULT_SRC = IS_LOCAL
      ? "http://localhost:3210/dvagusya"
      : "https://dev-web.restomania.ru/kugel/345";
    var params = new URLSearchParams(location.search);
    var src = params.get("src") || DEFAULT_SRC;
    // Только http(s) — чтобы ?src=javascript:… не исполнился в этой странице.
    if (!/^https?:\/\//i.test(src)) src = DEFAULT_SRC;

    document.getElementById("origin").textContent = location.origin;
    document.getElementById("src").textContent = src;
    document.getElementById("url").value = src;
    document.getElementById("frame").src = src;

    // Заблокированный фрейм не даёт события ошибки; браузер пишет причину в
    // консоль («Refused to frame … frame-ancestors»). Подсказка для проверяющего:
    document.getElementById("status").textContent =
      "Если во фрейме пусто или «страница заблокирована» — откройте консоль (F12): там будет причина от CSP frame-ancestors.";
  </script>
</body>
</html>
